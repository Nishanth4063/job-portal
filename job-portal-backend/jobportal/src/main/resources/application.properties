spring.application.name=jobportal
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:1433;databaseName=JobPortalDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# JWT Security Configurations
jobportal.jwt.secret=${JWT_SECRET}
jobportal.jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging Options
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE